<!DOCTYPE html>
<html>
<head>
    <script src="libs/sass/sass.sync.min.js"></script>
</head>
<body>
    <script>
        console.log('Sass available:', typeof Sass !== 'undefined');
        if (typeof Sass !== 'undefined') {
            console.log('Sass methods:', Object.keys(Sass));
            console.log('Sass.compile type:', typeof Sass.compile);
            
            // Test with minimal options
            try {
                Sass.compile('nav { ul { margin: 0; } }', {}, function(err, result) {
                    if (err) {
                        console.error('Error with empty options:', err);
                    } else {
                        console.log('Success with empty options:', result);
                    }
                });
            } catch(e) {
                console.error('Exception:', e);
            }
            
            // Test with style option
            try {
                Sass.compile('nav { ul { margin: 0; } }', { style: 1 }, function(err, result) {
                    if (err) {
                        console.error('Error with style option:', err);
                    } else {
                        console.log('Success with style option:', result);
                    }
                });
            } catch(e) {
                console.error('Exception with style:', e);
            }
        }
    </script>
</body>
</html>
